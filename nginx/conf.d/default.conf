server {
    listen 80;
    server_name niucloud.local;
    root /home/www/dongkuang/game-world-trading-backend/niucloud/public;
    index index.php;

    # 处理静态文件
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # 核心配置：支持 PATH_INFO 模式
    location / {
        # 如果请求的文件存在，直接返回
        if (-f $request_filename) {
            break;
        }
        
        # 如果请求的是目录且存在 index.php，重写到该目录的 index.php
        if (-d $request_filename) {
            rewrite ^(.*?)/?$ $1/index.php last;
        }
        
        # # 对于 PATH_INFO 格式的 URL，重写到对应的 PHP 文件
        # if (!-e $request_filename) {
        #     rewrite ^(.*?)(\.php)(.*)$ $2$3 last;
        #     rewrite ^(.*?)/(.*?)(/?.*)$ $1/$2.php$3 last;
        # }
    }

    location ~ \.php$ {
        if (!-e $request_filename) { 
            rewrite ^(.*)$ /index.php/$1 last; 
            break; 
        } 

        # 关键：捕获 PATH_INFO
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        
        fastcgi_pass php83:9000;
        fastcgi_index index.php;
        include fastcgi_params;
    }

    # # PHP 处理（支持 PATH_INFO）
    location ~ [^/]\.php(/|$) {
        # 防止重写循环
        if ($uri ~* "index\.php.*index\.php") {
            return 404;
        }
        
        # 关键：拆分 PATH_INFO
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        
        # 设置变量
        set $path_info $fastcgi_path_info;
        
        fastcgi_param PATH_INFO $path_info;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        
        # PHP-FPM 配置
        fastcgi_pass php83:9000;
        fastcgi_index index.php;
        include fastcgi_params;
    }

    # 专门处理 install.php 的路由
    location /install.php {
        try_files $uri =404;
        
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass php83:9000;
        fastcgi_index install.php;
        include fastcgi_params;
    }
}



##swoole测试
server {
    listen       8080;
    listen  [::]:8080;

    #access_log  /var/log/nginx/host.access.log  main;

    location / {
        root   /home/www;
        index  index.html index.htm index.php;
    }

    #error_page  404              /404.html;

    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

    # proxy the PHP scripts to Apache listening on 127.0.0.1:80
    #
    #location ~ \.php$ {
    #    proxy_pass   http://127.0.0.1;
    #}

    # pass the PHP scripts to FastCGI server listening on 127.0.0.1:9000
    #
    location ~ \.php$ {
        root   /home/www;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass   PHP74:9000;
        include fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
    }

    # deny access to .htaccess files, if Apache's document root
    # concurs with nginx's one
    #
    #location ~ /\.ht {
    #    deny  all;
    #}
}
